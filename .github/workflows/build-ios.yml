name: Build iOS (produce unsigned .xcarchive) - auto-detect workspace/project

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repo structure (debug)
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== src ==="
          ls -la src || true
          echo "=== src contents (depth 2) ==="
          find src -maxdepth 2 -type f -print || true

      - name: Set up Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.9'

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          cd src || exit 1
          pod repo update || true
          pod install --repo-update || true

      - name: Detect workspace/project and scheme
        id: detect
        working-directory: src
        run: |
          set -e
          WORKSPACE_FILE=$(ls -d *.xcworkspace 2>/dev/null | head -n1 || true)
          PROJECT_FILE=$(ls -d *.xcodeproj 2>/dev/null | head -n1 || true)

          echo "Found workspace: '$WORKSPACE_FILE'"
          echo "Found project:   '$PROJECT_FILE'"

          if [ -n "$WORKSPACE_FILE" ]; then
            SCHEMES_RAW=$(xcodebuild -workspace "$WORKSPACE_FILE" -list 2>/dev/null || true)
          elif [ -n "$PROJECT_FILE" ]; then
            SCHEMES_RAW=$(xcodebuild -project "$PROJECT_FILE" -list 2>/dev/null || true)
          else
            echo "::error ::No .xcworkspace or .xcodeproj found in src."
            exit 1
          fi

          echo "Raw schemes output:"
          echo "$SCHEMES_RAW"

          SCHEME=$(echo "$SCHEMES_RAW" | awk '/Schemes:/{flag=1; next} flag && NF{ gsub(/^[ \t]+|[ \t]+$/,"",$0); print; exit }')

          if [ -z "$SCHEME" ]; then
            if [ -n "$WORKSPACE_FILE" ]; then
              SCHEME=$(basename "$WORKSPACE_FILE" .xcworkspace)
            else
              SCHEME=$(basename "$PROJECT_FILE" .xcodeproj)
            fi
            SCHEME=$(echo "$SCHEME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            echo "Falling back to scheme: $SCHEME"
          fi

          echo "detected_scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "workspace_file=$WORKSPACE_FILE" >> $GITHUB_OUTPUT
          echo "project_file=$PROJECT_FILE" >> $GITHUB_OUTPUT

      - name: Build unsigned archive (.xcarchive)
        working-directory: src
        env:
          WORKSPACE: ${{ steps.detect.outputs.workspace_file }}
          PROJECT: ${{ steps.detect.outputs.project_file }}
          SCHEME: ${{ steps.detect.outputs.detected_scheme }}
        run: |
          set -e
          echo "WORKSPACE='$WORKSPACE'"
          echo "PROJECT='$PROJECT'"
          echo "SCHEME='$SCHEME'"

          mkdir -p build

          # Build with signing disabled so we can produce an unsigned archive.
          # This avoids requirement for a development team in CI.
          # Note: the produced archive will be unsigned; export must be done on a Mac with proper signing.
          if [ -n "$WORKSPACE" ]; then
            xcodebuild -workspace "$WORKSPACE" \
                       -scheme "$SCHEME" \
                       -configuration Release \
                       -sdk iphoneos \
                       -archivePath "$PWD/build/${SCHEME}.xcarchive" \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       clean archive | tee xcodebuild-archive.log
          else
            xcodebuild -project "$PROJECT" \
                       -scheme "$SCHEME" \
                       -configuration Release \
                       -sdk iphoneos \
                       -archivePath "$PWD/build/${SCHEME}.xcarchive" \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       clean archive | tee xcodebuild-archive.log
          fi

          echo "Archive step finished. Archive path: $PWD/build/${SCHEME}.xcarchive"
          ls -la build || true

      - name: Skip export (unsigned archive produced)
        working-directory: src
        run: |
          echo "Skipping export since archive is unsigned. Download the .xcarchive artifact and export on a Mac."

      - name: Upload artifacts (.xcarchive + logs)
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: |
            src/build/**/*.xcarchive
            src/xcodebuild-archive.log
